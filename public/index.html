<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام حجز سفينة البصرة - المحمرة</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 500px; margin: 20px auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #1e3a8a; text-align: center; margin-top: 0; }
        .status-box { background: #e0f2fe; border: 1px solid #bae6fd; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
        .status-box span { font-weight: bold; color: #0369a1; font-size: 1.2rem; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #334155; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 12px; background-color: #0284c7; color: white; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #0369a1; }
        .ticket { display: none; margin-top: 20px; padding: 15px; border: 2px dashed #0284c7; background: #f0fdf4; border-radius: 8px; }
        .ticket h3 { color: #166534; margin-top: 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚢 نظام حجز الرحلات البحرية</h2>
    <p style="text-align: center; color: #64748b; font-size: 0.9rem;">خط البصرة ⇆ المحمرة</p>

    <div class="status-box">
        المقاعد المتبقية: <span id="remaining">جاري التحميل...</span> / 235
    </div>

    <form id="bookingForm">
        <div class="form-group">
            <label>اسم المسافر الثلاثي:</label>
            <input type="text" id="name" required placeholder="أدخل الاسم الكامل">
        </div>
        <div class="form-group">
            <label>رقم الجواز:</label>
            <input type="text" id="passport" required placeholder="أدخل رقم الجواز">
        </div>
        <div class="form-group">
            <label>مسار الرحلة:</label>
            <select id="route">
                <option value="البصرة -> المحمرة">البصرة ← المحمرة</option>
                <option value="المحمرة -> البصرة">المحمرة ← البصرة</option>
            </select>
        </div>
        <button type="submit">تأكيد الحجز إصدار التذكرة</button>
    </form>

    <div id="ticketResult" class="ticket">
        <h3>✅ تم الحجز بنجاح!</h3>
        <p><strong>رقم التذكرة:</strong> <span id="tktId"></span></p>
        <p><strong>رقم المقعد:</strong> <span id="tktSeat"></span></p>
        <p><strong>الاسم:</strong> <span id="tktName"></span></p>
        <p><strong>الخط:</strong> <span id="tktRoute"></span></p>
        <p><strong>التاريخ:</strong> <span id="tktDate"></span></p>
    </div>
</div>

<script>
    async function loadStatus() {
        try {
            const res = await fetch('/api/status');
            const data = await res.json();
            document.getElementById('remaining').innerText = data.remaining;
        } catch (e) {
            document.getElementById('remaining').innerText = '235';
        }
    }

    document.getElementById('bookingForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('name').value;
        const passport = document.getElementById('passport').value;
        const route = document.getElementById('route').value;

        const res = await fetch('/api/book', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, passport, route })
        });

        const data = await res.json();
        if (data.success) {
            document.getElementById('tktId').innerText = data.ticket.id;
            document.getElementById('tktSeat').innerText = data.ticket.seat;
          document.getElementById('tktName').innerText = data.ticket.name;
            document.getElementById('tktRoute').innerText = data.ticket.route;
            document.getElementById('tktDate').innerText = data.ticket.date;
            document.getElementById('ticketResult').style.display = 'block';
            loadStatus();
        } else {
            alert(data.error || 'حدث خطأ في الحجز');
        }
    });

    loadStatus();
</script>

</body>
</html>
